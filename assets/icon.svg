<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="claude-awake: a crossed-out sleeping face">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="face" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
  </defs>

  <!-- Badge -->
  <rect width="128" height="128" rx="30" fill="url(#badge)"/>

  <!-- Sleeping face: closed eyes, small open mouth -->
  <circle cx="64" cy="64" r="34" fill="url(#face)"/>
  <g fill="none" stroke="#1e1b4b" stroke-width="5" stroke-linecap="round">
    <path d="M43.9 59.4 Q50.1 66.3 56.3 59.4"/>
    <path d="M71.7 59.4 Q77.9 66.3 84.1 59.4"/>
  </g>
  <ellipse cx="64" cy="79.5" rx="5.4" ry="6.6" fill="#1e1b4b"/>

  <!-- "No" sign -->
  <g fill="none" stroke="#f87171" stroke-width="9">
    <circle cx="64" cy="64" r="44"/>
    <line x1="32.9" y1="32.9" x2="95.1" y2="95.1"/>
  </g>
</svg>
