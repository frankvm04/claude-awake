<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">claude-awake</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <!-- crescent moon, with a gap cut where the slash crosses it -->
    <mask id="moon">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="256" cy="150" r="74" fill="#fff"/>
      <circle cx="292" cy="122" r="66" fill="#000"/>
      <line x1="186" y1="220" x2="326" y2="80" stroke="#000" stroke-width="46" stroke-linecap="round"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#c7d2fe">
    <circle cx="96"  cy="96"  r="5"/>
    <circle cx="410" cy="88"  r="4"/>
    <circle cx="428" cy="196" r="6"/>
    <circle cx="80"  cy="214" r="4"/>
    <circle cx="140" cy="160" r="3"/>
    <circle cx="372" cy="150" r="3"/>
  </g>

  <!-- "no sleep": slashed crescent -->
  <circle cx="256" cy="150" r="74" fill="#fbbf24" mask="url(#moon)"/>
  <line x1="186" y1="220" x2="326" y2="80" stroke="#fbbf24" stroke-width="16" stroke-linecap="round"/>

  <!-- closed laptop in perspective: lid (top face) + thin front edge -->
  <path d="M136 282 H376 Q392 282 398 296 L438 396 Q444 412 426 412 H86 Q68 412 74 396 L114 296 Q120 282 136 282 Z" fill="url(#lid)"/>
  <path d="M74 400 Q68 412 86 412 H426 Q444 412 438 400 L440 416 Q442 432 424 432 H88 Q70 432 72 416 Z" fill="#94a3b8"/>
  <rect x="226" y="424" width="60" height="8" rx="4" fill="#64748b"/>

  <!-- terminal prompt on the lid, glowing -->
  <ellipse cx="256" cy="348" rx="120" ry="58" fill="url(#glow)"/>
  <path d="M206 322 L238 348 L206 374" fill="none" stroke="#1e1b4b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="252" y="364" width="56" height="16" rx="8" fill="#f59e0b"/>
</svg>
